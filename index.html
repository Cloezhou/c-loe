.place-sheet{position:absolute;z-index:15;right:0;bottom:0;width:min(710px,58vw);height:310px;background:rgba(255,250,241,.97);border-radius:28px 0 0 0;padding:24px 24px 18px;box-shadow:-13px -10px 35px rgba(61,42,22,.12);transition:height .35s}.place-sheet.open{height:76%;overflow-y:auto}.sheet-handle{display:none}.sheet-title{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}.sheet-title small,.collection-top small,.profile-card small,.route-card small,.detail-copy>small{font:700 9px system-ui,sans-serif;letter-spacing:.17em;color:var(--accent)}.sheet-title h2{font-size:20px;margin:3px 0 0}.sheet-title>button{border:0;background:none;color:var(--accent);font-size:11px;cursor:pointer}.place-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.place-card{border:1px solid var(--line);border-radius:15px;background:#fffaf1;overflow:hidden;box-shadow:0 6px 18px rgba(59,42,22,.06)}.card-photo{width:100%;height:92px;border:0;position:relative;display:grid;place-items:center;color:white;overflow:hidden;cursor:pointer;background-size:cover}.card-photo:after,.detail-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,transparent,rgba(27,15,7,.45))}.card-photo>span{position:absolute;left:9px;bottom:7px;z-index:2;font:9px system-ui,sans-serif}.card-photo>b{font-size:30px;z-index:1}.card-photo>em{position:absolute;left:0;top:0;z-index:2;font-style:normal;font-size:9px;background:var(--accent);padding:5px 9px}.photo-1{background:linear-gradient(140deg,#53705d,#c79056 48%,#39291e)}.photo-2{background:linear-gradient(140deg,#a38155,#443124 55%,#d8a961)}.photo-3{background:linear-gradient(140deg,#66827e,#b0714b 60%,#33241f)}.photo-4{background:linear-gradient(140deg,#9d7252,#534138 55%,#cf9661)}.photo-5{background:linear-gradient(140deg,#567058,#a9a174 60%,#3f4938)}.card-copy{padding:11px}.card-copy>small{color:var(--accent);font:9px system-ui,sans-serif}.card-copy h3{font-size:14px;margin:4px 0}.card-copy p{font:9px system-ui,sans-serif;color:var(--muted);margin:0 0 9px}.card-copy>div{display:flex;align-items:center;justify-content:space-between;gap:5px}.card-copy>div span{font:8px system-ui,sans-serif;color:var(--muted)}.card-copy>div button{border:1px solid #c27e5f;color:var(--accent);background:none;border-radius:9px;padding:5px 8px;font-size:9px}.empty{grid-column:1/-1;text-align:center;padding:45px}.empty b{display:block;margin-bottom:12px}.empty button{border:1px solid var(--line);background:white;border-radius:16px;padding:8px 15px}
.collection-screen,.profile-screen{min-height:calc(100dvh - 74px);padding:55px 7vw 90px;background:radial-gradient(circle at 50% 0,#fffaf0,var(--paper) 60%)}.collection-top{text-align:center;max-width:520px;margin:auto}.collection-top h1{font-size:37px;margin:10px 0}.collection-top p{font:13px/1.8 system-ui,sans-serif;color:var(--muted)}.collection-top .progress{width:280px;height:6px;border-radius:5px;background:#dfd3bf;margin:25px auto 8px;overflow:hidden}.collection-top .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold))}.collection-top>b{font-size:12px;color:var(--accent)}.collection-filters{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:34px 0}.collection-filters button{border:1px solid var(--line);background:var(--paper2);border-radius:18px;padding:7px 13px;font-size:11px}.collection-filters button.active{background:var(--deep);border-color:var(--deep);color:white}.badge-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:28px 16px;max-width:980px;margin:auto}.badge-card{border:0;background:none;text-align:center}.badge-medal{width:104px;height:116px;margin:auto;display:grid;place-items:center;background:linear-gradient(145deg,#e2bd68,#825035);clip-path:polygon(50% 0,86% 13%,100% 48%,82% 88%,50% 100%,18% 88%,0 48%,14% 13%);filter:drop-shadow(0 5px 4px rgba(75,52,27,.22))}.badge-medal i{width:88px;height:98px;display:grid;place-items:center;background:linear-gradient(145deg,#cfdfc5,#f5d9aa);clip-path:inherit;font-style:normal;font-size:31px;color:#784531}.badge-card h3{font-size:13px;margin:9px 0 3px}.badge-card p{font:9px system-ui,sans-serif;color:var(--muted);margin:0}.badge-card.locked{filter:grayscale(1);opacity:.38}
.profile-screen{display:grid;grid-template-columns:minmax(330px,520px) minmax(300px,480px);justify-content:center;align-items:center;gap:45px}.profile-card{text-align:center;padding:45px;border:1px solid var(--line);border-radius:28px;background:rgba(255,250,240,.82);box-shadow:0 20px 50px rgba(67,46,23,.09)}.avatar{width:95px;height:95px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff3dd;border:6px double #e5c284;font-size:39px}.profile-card h1{font-size:31px;margin:8px}.profile-card>p{color:var(--muted);font-size:12px}.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:30px;border-block:1px solid var(--line);padding:20px 0}.profile-stats div{display:flex;flex-direction:column;border-right:1px solid var(--line)}.profile-stats div:last-child{border:0}.profile-stats b{font-size:20px}.profile-stats span{font:9px system-ui,sans-serif;color:var(--muted)}.route-card{padding:35px;border-radius:28px;background:linear-gradient(145deg,#ead6b3,#cdb68f);border:1px solid #bda47e}.route-card h2{font-size:28px}.route-card p,.route-card span{font:12px/1.8 system-ui,sans-serif;color:#675740}.route-card span{display:block}.route-card button{width:100%;margin-top:25px;border:0;border-radius:13px;background:var(--accent);color:white;padding:13px}
.mobile-nav{display:none}.modal{position:fixed;inset:0;z-index:100;background:rgba(33,24,16,.52);display:flex;align-items:flex-end;justify-content:center}.place-detail{width:min(470px,100%);max-height:94dvh;overflow:auto;border-radius:27px 27px 0 0;background:var(--paper2);box-shadow:0 -25px 70px rgba(26,18,12,.28);position:relative;animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(30%);opacity:.4}}.close{position:absolute;right:14px;top:14px;z-index:5;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,248,235,.9);font-size:22px}.detail-hero{height:230px;display:flex;align-items:end;padding:20px;color:white;position:relative}.detail-hero>span{position:relative;z-index:2;font-size:12px}.large-pin{position:absolute;z-index:2;left:50%;top:43px;transform:translateX(-50%);width:88px;height:96px;display:grid;place-items:center;clip-path:polygon(50% 0,88% 15%,100% 62%,50% 100%,0 62%,12% 15%);background:linear-gradient(145deg,#e4bd68,#995535);font-size:31px}.detail-copy{padding:22px}.detail-copy h2{font-size:26px;margin:7px 0 12px}.tags{display:flex;gap:6px}.tags span{font:9px system-ui,sans-serif;padding:5px 8px;border-radius:11px;background:#eadcc5}.detail-copy>p{font:12px/1.8 system-ui,sans-serif;color:var(--muted)}.recommend{display:flex;justify-content:space-between;margin:15px 0;padding:14px;border:1px solid var(--line);background:#f2e4cd;border-radius:13px}.recommend span{font-size:11px}.recommend b{color:var(--accent)}.check-rule{font:10px/1.6 system-ui,sans-serif;color:#667355;background:#e9eddf;padding:10px;border-radius:10px}.detail-actions{display:flex;gap:9px;margin-top:15px}.detail-actions button{flex:1;border:1px solid #b66f51;border-radius:12px;background:none;color:var(--accent);padding:12px}.detail-actions .primary{color:white;background:var(--accent)}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:150;width:max-content;max-width:90%;border:0;border-radius:24px;background:#33291f;color:#fff4e2;padding:12px 18px;font:12px system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.28)}

  .collection-screen,.profile-screen{min-height:calc(100dvh - 62px);padding:35px 16px 90px}.collection-top h1{font-size:28px}.collection-filters{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;margin:25px -2px 30px}.collection-filters button{flex:none}.badge-grid{grid-template-columns:repeat(3,1fr);gap:25px 7px}.badge-medal{width:88px;height:98px}.badge-medal i{width:74px;height:83px;font-size:27px}.badge-card h3{font-size:11px}.profile-screen{display:block}.profile-card{padding:30px 18px}.route-card{margin-top:20px;padding:24px}.route-card h2{font-size:23px}.modal{z-index:100}.detail-hero{height:210px}.toast{bottom:77px}
}
</style>
</head>
<body>
  <div id="app"></div>
  <script>const places=[
{id:1,name:"时光里咖啡馆",category:"咖啡店",distance:.32,area:"潮宗街",tags:["独立咖啡","老街","手冲"],recommend:"桂花拿铁",description:"藏在潮宗街老房子里的小院咖啡馆，木窗、旧砖和午后的光都很长沙。",x:57,y:50,icon:"☕"},
{id:2,name:"山止川行 Coffee",category:"咖啡店",distance:.68,area:"开福寺",tags:["庭院","安静","特调"],recommend:"橘洲气泡美式",description:"闹中取静的城市庭院，适合慢慢喝一杯。",x:70,y:30,icon:"☕"},
{id:3,name:"岳麓书院",category:"风景名胜",distance:1.1,area:"岳麓山",tags:["古建","人文","山景"],recommend:"千年学府",description:"沿岳麓山脚走进千年书院，在檐角与碑刻之间寻找湖湘故事。",x:22,y:43,icon:"亭"},
{id:4,name:"橘子洲头",category:"风景名胜",distance:1.4,area:"橘子洲",tags:["江景","地标","散步"],recommend:"湘江日落",description:"沿江风一路走到洲头，傍晚是最适合打卡的时间。",x:44,y:57,icon:"洲"},
{id:5,name:"乐之书店",category:"书店",distance:1.6,area:"岳麓区",tags:["阅读","设计","安静"],recommend:"城市书单",description:"一间适合慢慢翻书的城市阅读空间。",x:66,y:63,icon:"书"},
{id:6,name:"太平老街",category:"餐厅甜品",distance:1.8,area:"天心区",tags:["湘味","老街","烟火气"],recommend:"糖油粑粑",description:"从街头小吃一路吃到老字号。",x:61,y:72,icon:"食"},
{id:7,name:"湖南省博物馆",category:"展览场馆",distance:2.2,area:"开福区",tags:["历史","展览","室内"],recommend:"马王堆汉墓",description:"一次走近两千年前的长沙。",x:77,y:35,icon:"博"},
{id:8,name:"烈士公园",category:"公园",distance:2.5,area:"开福区",tags:["散步","湖景","自然"],recommend:"年嘉湖漫步",description:"城市中心的一大片绿意。",x:86,y:48,icon:"树"},
{id:9,name:"杜甫江阁夜游",category:"夜间去处",distance:2.8,area:"湘江中路",tags:["夜景","江风","摄影"],recommend:"湘江灯火",description:"亮灯后的江阁与湘江夜色。",x:52,y:78,icon:"月"},
{id:10,name:"梅溪湖大剧院",category:"展览场馆",distance:5.8,area:"梅溪湖",tags:["建筑","演出","夜景"],recommend:"建筑漫步",description:"流线型白色建筑倒映在湖面。",x:16,y:68,icon:"展"}];
const categories=["全部","咖啡店","风景名胜","书店","餐厅甜品","展览场馆","公园","夜间去处"];
const glyph={全部:"✦",咖啡店:"☕",风景名胜:"亭",书店:"书",餐厅甜品:"食",展览场馆:"展",公园:"树",夜间去处:"月"};
let state={theme:localStorage.getItem("xingji-theme")||((matchMedia("(prefers-color-scheme: dark)").matches)?"night":"day"),tab:"map",category:"全部",radius:10,status:"全部",lit:JSON.parse(localStorage.getItem("xingji-lit")||"[3,4,7]"),sheet:false,filter:false,selected:null,notice:""};
const root=document.querySelector("#app");
const visible=()=>places.filter(p=>(state.category==="全部"||p.category===state.category)&&p.distance<=state.radius&&(state.status==="全部"||(state.status==="已点亮"?state.lit.includes(p.id):!state.lit.includes(p.id))));
const distance=p=>p.distance<1?`${p.distance*1000}m`:`${p.distance}km`;
function render(){
document.documentElement.style.background=state.theme==="night"?"#07131c":"#f8f0e1";
root.innerHTML=`<main class="app theme-${state.theme}">
<header class="topbar"><button class="brand" data-action="home"><b>行迹</b><span>城市打卡地图 · 长沙</span></button><nav class="desktop-nav"><button class="${state.tab==="map"?"active":""}" data-tab="map">探索地图</button><button class="${state.tab==="badges"?"active":""}" data-tab="badges">徽章收藏</button><button class="${state.tab==="me"?"active":""}" data-tab="me">我的行迹</button></nav><button class="mode" data-action="theme"><i>${state.theme==="day"?"☾":"☀"}</i><span>${state.theme==="day"?"夜间":"白天"}</span></button></header>
${state.tab==="map"?mapView():state.tab==="badges"?badgeView():profileView()}
<nav class="mobile-nav"><button class="${state.tab==="map"?"active":""}" data-tab="map"><i>⌖</i><span>地图</span></button><button class="${state.tab==="badges"?"active":""}" data-tab="badges"><i>✦</i><span>徽章</span></button><button class="${state.tab==="me"?"active":""}" data-tab="me"><i>人</i><span>我的</span></button></nav>
${state.selected?detailView(state.selected):""}${state.notice?`<button class="toast" data-action="clear-notice">${state.notice}</button>`:""}</main>`}
function mapView(){let v=visible();return `<section class="map-screen"><div class="map-art"><div class="map-shade"></div><div class="city-label yuelu">岳麓山</div><div class="city-label river-label">湘江</div><div class="city-label kaifu">开福区</div><div class="city-label tianxin">天心区</div><div class="city-label orange">橘子洲</div>
<div class="category-strip">${categories.map(c=>`<button class="${state.category===c?"active":""}" data-category="${c}"><i>${glyph[c]}</i><span>${c==="风景名胜"?"景点":c}</span></button>`).join("")}<button class="more-filter" data-action="filter">筛选⌄</button></div>
${state.filter?`<div class="filter-pop"><div><b>距离</b>${[1,3,5,10].map(n=>`<button class="${state.radius===n?"active":""}" data-radius="${n}">${n}公里</button>`).join("")}</div><div><b>状态</b>${["全部","未点亮","已点亮"].map(s=>`<button class="${state.status===s?"active":""}" data-status="${s}">${s}</button>`).join("")}</div></div>`:""}
${v.map(p=>`<button class="map-pin pin-${p.category} ${state.lit.includes(p.id)?"lit":""}" style="left:${p.x}%;top:${p.y}%" data-place="${p.id}"><span><b>${p.icon}</b></span><em>${p.name}</em></button>`).join("")}<div class="user-dot"><i></i></div><div class="map-tools"><button data-action="locate">◎</button><button>＋</button><button>−</button></div></div>
<aside class="badge-summary"><div><span>已点亮</span><strong>${state.lit.length}</strong><small>/ ${places.length}</small></div><p>继续探索，点亮更多长沙记忆</p><div class="mini-badges">${places.slice(0,6).map(p=>`<i class="${state.lit.includes(p.id)?"lit":""}">${p.icon}</i>`).join("")}</div><button data-tab="badges">查看我的徽章收藏 <span>→</span></button></aside>
<section class="place-sheet ${state.sheet?"open":""}"><button class="sheet-handle" data-action="sheet"><i></i></button><div class="sheet-title"><div><small>DISCOVER NEARBY</small><h2>附近的地点</h2></div><button data-action="sheet">${state.sheet?"收起":"查看全部"} →</button></div><div class="place-grid">${v.slice(0,state.sheet?10:3).map((p,i)=>card(p,i)).join("")}${v.length?"":`<div class="empty"><b>没有符合条件的地点</b><button data-action="reset">清除筛选</button></div>`}</div></section></section>`}
function card(p,i){return `<article class="place-card"><button class="card-photo photo-${(p.id%5)+1}" data-place="${p.id}"><span>${p.category}</span><b>${p.icon}</b>${i===0?"<em>精选</em>":""}</button><div class="card-copy"><small>${p.category} · ${p.area}</small><h3>${p.name}</h3><p>${p.tags.join(" · ")}</p><div><span>${distance(p)} · 步行约 ${Math.ceil(p.distance*12)} 分钟</span><button data-place="${p.id}">${state.lit.includes(p.id)?"已点亮":"去打卡"}</button></div></div></article>`}
function badgeView(){return `<section class="collection-screen"><div class="collection-top"><small>CITY MEMORY COLLECTION</small><h1>我的城市徽章</h1><p>每一次真实抵达，都会在城市里留下一枚属于你的光。</p><div class="progress"><i style="width:${state.lit.length/places.length*100}%"></i></div><b>${state.lit.length} / ${places.length} 已点亮</b></div><div class="collection-filters">${categories.map(c=>`<button class="${state.category===c?"active":""}" data-category="${c}">${c==="风景名胜"?"景点":c}</button>`).join("")}</div><div class="badge-grid">${places.filter(p=>state.category==="全部"||p.category===state.category).map(p=>`<button class="badge-card ${state.lit.includes(p.id)?"lit":"locked"}" data-place="${p.id}"><div class="badge-medal"><i>${p.icon}</i></div><h3>${p.name}</h3><p>${state.lit.includes(p.id)?"徽章已点亮":"去打卡点亮"}</p></button>`).join("")}</div></section>`}
function profileView(){return `<section class="profile-screen"><div class="profile-card"><div class="avatar">行</div><small>CHANGSHA EXPLORER</small><h1>长沙漫游者</h1><p>第 2 级 · 街巷初探</p><div class="profile-stats"><div><b>${state.lit.length}</b><span>点亮徽章</span></div><div><b>6.8km</b><span>探索里程</span></div><div><b>7</b><span>地点类型</span></div></div></div><article class="route-card"><small>今日推荐路线</small><h2>老街咖啡与人文漫步</h2><p>潮宗街 → 五一广场 → 杜甫江阁</p><span>4.2 公里 · 约 2 小时 · 5 个可点亮地点</span><button data-tab="map">开始探索</button></article></section>`}
function detailView(p){return `<div class="modal" data-action="close"><article class="place-detail"><button class="close" data-action="close">×</button><div class="detail-hero photo-${(p.id%5)+1}"><div class="large-pin">${p.icon}</div><span>${p.category} · ${p.area}</span></div><div class="detail-copy"><small>CHANGSHA CHECK-IN PLACE</small><h2>${p.name}</h2><div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join("")}</div><p>${p.description}</p><div class="recommend"><span>到这里别错过</span><b>${p.recommend}</b></div><div class="check-rule">抵达地点附近 200 米内即可打卡，成功后点亮专属徽章。</div><div class="detail-actions"><button data-action="navigate">导航前往</button><button class="primary" data-action="checkin" data-id="${p.id}">${state.lit.includes(p.id)?"✓ 徽章已点亮":"✦ 到店打卡"}</button></div></div></article></div>`}
root.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
if(t.dataset.tab){state.tab=t.dataset.tab;state.selected=null}
if(t.dataset.category){state.category=t.dataset.category}
if(t.dataset.radius){state.radius=Number(t.dataset.radius)}
if(t.dataset.status){state.status=t.dataset.status}
if(t.dataset.place){state.selected=places.find(p=>p.id===Number(t.dataset.place))}
if(t.dataset.action==="theme"){state.theme=state.theme==="day"?"night":"day";localStorage.setItem("xingji-theme",state.theme)}
if(t.dataset.action==="home"){state.tab="map";state.category="全部"}
if(t.dataset.action==="filter")state.filter=!state.filter;
if(t.dataset.action==="sheet")state.sheet=!state.sheet;
if(t.dataset.action==="reset"){state.category="全部";state.radius=10;state.status="全部"}
if(t.dataset.action==="clear-notice")state.notice="";
if(t.dataset.action==="navigate")state.notice="已为你打开导航";
if(t.dataset.action==="locate"){state.notice="正在定位…";navigator.geolocation?.getCurrentPosition(()=>{state.notice="定位成功，已更新附近地点";render()},()=>{state.notice="暂未获得定位权限，当前显示长沙示例地点";render()},{timeout:5000})}
if(t.dataset.action==="checkin"){const id=Number(t.dataset.id);if(!state.lit.includes(id)){state.lit.push(id);localStorage.setItem("xingji-lit",JSON.stringify(state.lit));state.notice="打卡成功，徽章已点亮"}else state.notice="这枚徽章已经点亮"}
if(t.dataset.action==="close"&&e.target===t)state.selected=null;
render()});
render();
</script>
</body>
