<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf2">
  <title>行迹 · 美食地图</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--paper:#fffaf2;--panel:rgba(255,252,246,.96);--ink:#221d17;--muted:#766e64;--line:#e7ddd0;--red:#e6502d;--green:#2d6b51;--violet:#5d3fa1;--shadow:0 14px 42px rgba(73,50,28,.17)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper)}
    button,input,select{font:inherit}button{cursor:pointer}
    .app{height:100dvh;position:relative;background:var(--paper);transition:.25s}
    header{position:absolute;z-index:1000;top:0;left:0;right:0;height:62px;display:flex;align-items:center;gap:10px;padding:0 13px;background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
    .brand{border:0;background:none;padding:0;text-align:left;display:flex;align-items:baseline;gap:7px;color:var(--ink)}
    .brand b{font:700 25px/1 "Songti SC","STSong",serif;letter-spacing:.08em}.brand span{font-size:10px;color:var(--red);font-weight:800}
    .where{min-width:0;flex:1;border:0;background:none;display:flex;align-items:center;gap:5px;padding:7px 4px;color:var(--ink)}
    .where i{font-style:normal;color:var(--red)}.where span{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .head-actions{display:flex;gap:7px}.head-actions button{height:36px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
    .ai-btn{width:38px;border:0!important;background:linear-gradient(135deg,#3e2c73,#7651be)!important;color:white!important;font-size:17px}.theme-btn{width:38px}
    #map{position:absolute;inset:62px 0 62px;background:#e8e2da}
    .searchbox{position:absolute;z-index:600;top:74px;left:10px;right:10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}
    .searchrow{height:40px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:0 10px}
    .searchrow span{color:var(--red);font-size:18px}.searchrow input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font-size:11px}.searchrow em{font-style:normal;font-size:8px;font-weight:800;color:var(--violet);background:#eee7fa;padding:4px 6px;border-radius:5px}
    .chips,.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
    .chips{margin:9px 0 8px}.chips button,.filters button,.filters select{flex:none;border:1px solid var(--line);border-radius:15px;background:var(--paper);color:var(--ink);padding:6px 10px;font-size:10px}
    .chips button.on{background:var(--red);border-color:var(--red);color:white;font-weight:800}.filters select{appearance:none;padding-right:13px}.filters button.on{color:var(--green);background:#e6f2eb;border-color:#a8c9b9}
    .map-fab{position:absolute;z-index:550;width:43px;height:43px;border:0;border-radius:13px;background:var(--panel);color:#2872a7;box-shadow:var(--shadow);font-size:21px}
    .locate{left:11px;bottom:295px}.reload{right:11px;bottom:295px;color:var(--red);font-size:17px}.leaflet-control-zoom{margin-right:11px!important;margin-bottom:285px!important;border:0!important;box-shadow:var(--shadow)!important}.leaflet-control-zoom a{border:0!important;background:var(--panel)!important;color:var(--ink)!important}.leaflet-control-attribution{font-size:7px!important}
    .pin-wrap{background:none!important;border:0!important}.pin{width:38px;height:46px;position:relative;display:grid;place-items:center;color:white;font-size:11px;font-weight:900;filter:drop-shadow(0 4px 4px rgba(35,22,11,.35))}
    .pin:before{content:"";position:absolute;width:33px;height:33px;border:3px solid white;border-radius:50% 50% 50% 7px;transform:rotate(-45deg);background:var(--red)}.pin span{z-index:1;transform:translateY(-5px)}.pin.live:before{background:var(--green)}.pin.active{transform:scale(1.25) translateY(-4px)}
    .sheet{position:absolute;z-index:700;left:0;right:0;bottom:62px;height:224px;padding:7px 12px 13px;border-radius:25px 25px 0 0;background:var(--panel);box-shadow:0 -12px 38px rgba(68,45,23,.16);transition:.28s;backdrop-filter:blur(18px)}
    .sheet.full{height:calc(100dvh - 116px);overflow:auto}.handle{height:16px;width:100%;border:0;background:none}.handle:after{content:"";display:block;width:45px;height:4px;margin:auto;border-radius:4px;background:#c8bdb0}
    .sheet-head{height:48px;display:flex;align-items:flex-start;justify-content:space-between}.sheet-head small{font-size:8px;letter-spacing:.14em;font-weight:900;color:var(--red)}.sheet-head h2{font:700 18px/1.1 "Songti SC","STSong",serif;margin:3px 0}.sheet-head p{font-size:9px;color:var(--muted);margin:2px 0}.sheet-head button{border:0;background:none;color:var(--red);font-size:10px;padding:7px}
    .cards{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}.cards::-webkit-scrollbar{display:none}.sheet.full .cards{display:block;overflow:visible}
    .card{flex:none;width:min(318px,86vw);height:130px;display:grid;grid-template-columns:104px 1fr;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:var(--paper);box-shadow:0 6px 17px rgba(63,43,25,.08)}
    .sheet.full .card{width:100%;margin-bottom:10px}.card.active{border-color:#eb8e75}.pic{position:relative;display:grid;place-items:center;color:white;background:linear-gradient(145deg,#bd6138,#5d3424)}.pic:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 65% 25%,rgba(255,255,255,.26),transparent 30%),linear-gradient(160deg,transparent,rgba(20,9,3,.4))}.pic b{z-index:1;font:700 37px "Songti SC",serif}.pic small{position:absolute;z-index:2;left:7px;bottom:7px;font-size:8px}.copy{min-width:0;padding:10px}.title{display:flex;gap:4px;align-items:center}.title h3{flex:1;min-width:0;font-size:13px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.save{border:0;background:none;color:var(--red);font-size:18px;padding:0}.rating{display:flex;gap:6px;margin:5px 0;font-size:9px;color:var(--muted)}.rating b{color:var(--red)}.copy>p{font-size:9px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy>strong{display:block;font-size:10px;margin:7px 0}.meta{display:flex;justify-content:space-between;font-size:8px;color:var(--muted)}.meta i{font-style:normal;color:var(--green)}
    .detail{position:absolute;z-index:650;left:10px;right:10px;bottom:294px;padding:14px;border:1px solid var(--line);border-radius:17px;background:var(--panel);box-shadow:var(--shadow)}.detail .x{position:absolute;right:9px;top:8px;width:27px;height:27px;border:0;border-radius:50%;background:#eee7dc;color:var(--ink)}.detail small{font-size:8px;color:var(--red);font-weight:900}.detail h2{font:700 18px "Songti SC",serif;margin:4px 28px 5px 0}.detail p{font-size:10px;color:var(--muted);margin:0 0 10px}.actions{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px}.actions button{height:34px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:9px;font-weight:800}.actions .primary{background:var(--red);border-color:var(--red);color:white}
    nav{position:absolute;z-index:1000;left:0;right:0;bottom:0;height:62px;display:flex;padding:4px 24px max(5px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px)}nav button{flex:1;border:0;background:none;color:#93897d;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:2px}nav i{font-style:normal;font-size:19px}nav button.on{color:var(--red);font-weight:900}
    .page{position:absolute;z-index:500;inset:62px 0;background:radial-gradient(circle at 50% 0,#fff,var(--paper) 65%);overflow:auto;padding:30px 14px 85px}.page-title{text-align:center}.page-title small{font-size:8px;letter-spacing:.16em;color:var(--red);font-weight:900}.page-title h1{font:700 29px "Songti SC",serif;margin:7px}.page-title p{font-size:11px;color:var(--muted)}.saved-list{display:grid;gap:10px;margin-top:24px}.empty{text-align:center;padding:52px 16px}.empty span{font-size:42px;color:#cdbfb1}.empty h2{font:700 22px "Songti SC",serif}.empty p{font-size:11px;line-height:1.7;color:var(--muted)}
    .profile-card,.future{padding:25px;margin:0 auto 14px;max-width:520px;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:var(--shadow)}.avatar{width:68px;height:68px;display:grid;place-items:center;border-radius:22px;background:var(--red);color:white;font:700 30px "Songti SC",serif}.profile-card h1{font:700 27px "Songti SC",serif;margin:14px 0 7px}.profile-card p,.future p{font-size:11px;line-height:1.7;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);padding-top:17px;margin-top:17px;border-top:1px solid var(--line)}.stats span{display:flex;flex-direction:column;font-size:8px;color:var(--muted)}.stats b{font-size:20px;color:var(--ink)}.future{color:white;background:linear-gradient(145deg,#34275e,#754db7);border:0}.future small{color:#dec9ff;font-size:8px}.future h2{font:700 24px "Songti SC",serif}.future p{color:#e7dff1}
    .overlay{position:fixed;z-index:3000;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(23,18,30,.55);backdrop-filter:blur(5px)}.ai-sheet{position:relative;width:min(560px,100%);padding:26px 18px 28px;border-radius:26px 26px 0 0;background:#fbf8ff;color:#261f2d}.ai-sheet .x{position:absolute;right:14px;top:14px;width:33px;height:33px;border:0;border-radius:50%;background:#eee7f5}.ai-logo{width:45px;height:45px;display:grid;place-items:center;border-radius:14px;background:var(--violet);color:#ffd878;font-size:22px}.ai-sheet small{font-size:8px;letter-spacing:.14em;color:var(--violet);font-weight:900}.ai-sheet h2{font:700 25px "Songti SC",serif;margin:7px 0}.ai-sheet>p{font-size:11px;color:#716879;line-height:1.7}.prompts{display:flex;gap:6px;overflow:auto;margin:15px 0}.prompts button{flex:none;border:1px solid #ddd1e8;border-radius:15px;background:white;padding:7px 9px;font-size:9px;color:#624e79}.ask{display:flex;padding:5px;border:1px solid #d9cde4;border-radius:13px;background:white}.ask input{flex:1;min-width:0;border:0;outline:0;padding:7px;background:none;font-size:11px}.ask button{border:0;border-radius:9px;background:var(--violet);color:white;padding:0 13px;font-size:10px}.reply{margin-top:12px;padding:13px;border-radius:12px;background:#eee8f6;font-size:10px;line-height:1.7}.toast{position:fixed;z-index:4000;left:50%;bottom:74px;transform:translateX(-50%);max-width:90%;padding:10px 15px;border-radius:20px;background:#27211b;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;box-shadow:0 8px 25px rgba(0,0,0,.25)}
    .hidden{display:none!important}
    .night{--paper:#0d171c;--panel:rgba(18,31,38,.96);--ink:#f3ebe1;--muted:#aaa197;--line:#2a3d45;--red:#f17552;--green:#69bd93}.night header,.night nav{background:var(--panel)}.night .page{background:radial-gradient(circle at 50% 0,#172a33,var(--paper) 65%)}.night .filters button.on{background:#173629}.night .detail .x{background:#263942}.night .ai-sheet{background:#171322;color:#f3ebf8}.night .ai-sheet>p{color:#afa4b5}.night .prompts button,.night .ask{background:#231b30;color:#eee}.night .reply{background:#2a213a}
    @media(min-width:780px){header{height:70px;padding:0 22px}.brand b{font-size:29px}.brand span{font-size:12px}.where{max-width:300px;margin-left:20px}.ai-btn{width:auto;padding:0 15px}.ai-btn:after{content:" AI 找吃的";font-size:11px;font-weight:800}#map{inset:70px 0 0}.searchbox{top:87px;left:18px;right:auto;width:370px}.sheet{bottom:0;height:225px;padding-left:22px;padding-right:22px}.card{width:340px}.detail{left:auto;right:18px;top:88px;bottom:auto;width:310px}nav{display:none}.page{inset:70px 0 0;padding:60px 7vw}.saved-list{grid-template-columns:repeat(3,1fr);max-width:1100px;margin:35px auto}.locate{bottom:235px}.reload{bottom:235px}.leaflet-control-zoom{margin-bottom:225px!important}.toast{bottom:24px}}
  </style>
</head>
<body>
<div id="app" class="app">
  <header>
    <button class="brand" data-tab="map"><b>行迹</b><span>美食地图</span></button>
    <button id="where" class="where"><i>⌖</i><span>长沙·五一广场</span></button>
    <div class="head-actions"><button id="aiOpen" class="ai-btn" aria-label="AI找吃的">✦</button><button id="theme" class="theme-btn" aria-label="切换日夜模式">☾</button></div>
  </header>
  <section id="mapPage">
    <div id="map"></div>
    <div class="searchbox">
      <div class="searchrow"><span>⌕</span><input id="keyword" placeholder="搜索餐厅、菜系或招牌菜"><em>AI 可接入</em></div>
      <div id="chips" class="chips"></div>
      <div class="filters">
        <select id="radius"><option value="1">1公里内</option><option value="3">3公里内</option><option value="5" selected>5公里内</option><option value="10">10公里内</option></select>
        <select id="price"><option value="0">不限人均</option><option value="1">¥ 经济</option><option value="2">¥¥ 适中</option><option value="3">¥¥¥ 品质</option></select>
        <select id="sort"><option>推荐</option><option>距离</option><option>评分</option></select>
        <button id="openOnly">营业中</button>
      </div>
    </div>
    <button id="locate" class="map-fab locate" aria-label="定位">⌖</button>
    <button id="reload" class="map-fab reload" aria-label="搜索此区域">↻</button>
    <div id="detail" class="detail hidden"></div>
    <section id="sheet" class="sheet">
      <button id="handle" class="handle" aria-label="展开附近美食"></button>
      <div class="sheet-head"><div><small>NEARBY FOOD</small><h2>附近值得吃</h2><p id="count">正在准备推荐…</p></div><button id="expand">查看全部</button></div>
      <div id="cards" class="cards"></div>
    </section>
  </section>
  <section id="savedPage" class="page hidden"><div class="page-title"><small>MY COLLECTION</small><h1>我的收藏</h1><p>把想吃的地方放进自己的美食清单</p></div><div id="savedList" class="saved-list"></div></section>
  <section id="profilePage" class="page hidden"><div class="profile-card"><div class="avatar">迹</div><h1>我的行迹</h1><p>每一次寻找与到店，都在慢慢绘制属于你的城市味觉地图。</p><div class="stats"><span><b id="statSaved">0</b>收藏</span><span><b id="statChecked">0</b>已打卡</span><span><b id="statCities">1</b>探索城市</span></div></div><div class="future"><small>NEXT · AI FOOD GUIDE</small><h2>让 AI 真正懂你的口味</h2><p>后续可接入 GPT，并结合实时位置、预算、口味、距离与排队情况，回答“附近两个人100元吃什么”。</p></div></section>
  <nav><button class="on" data-tab="map"><i>⌖</i>地图</button><button data-tab="saved"><i>♡</i>收藏</button><button data-tab="profile"><i>◉</i>我的</button></nav>
  <div id="aiOverlay" class="overlay hidden"><div class="ai-sheet"><button id="aiClose" class="x">×</button><div class="ai-logo">✦</div><small>AI FOOD GUIDE</small><h2>附近吃什么？</h2><p>先用当前地点与筛选条件给你推荐。正式接入 GPT 后，可进一步理解预算、口味、人数和排队偏好。</p><div id="prompts" class="prompts"><button>附近100元以内两个人吃什么</button><button>想吃辣的，不想排队</button><button>找一家安静的咖啡店</button></div><div class="ask"><input id="aiQuery" placeholder="告诉我现在想吃什么"><button id="aiAsk">推荐</button></div><div id="aiReply" class="reply hidden"></div></div></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const C=[28.1953,112.9769];
  const curated=[
    ["c1","文和友老长沙龙虾馆","湘菜","长沙小吃",28.19093,112.97178,4.7,2,"口味虾、猪油拌粉","海信广场附近",1],
    ["c2","黑色经典臭豆腐","小吃","街头小吃",28.19441,112.97516,4.6,1,"黑色臭豆腐","黄兴南路步行街",1],
    ["c3","笨萝卜浏阳菜馆","湘菜","浏阳菜",28.19826,112.97874,4.8,2,"酸菜炒粉皮、金钱蛋","五一广场商圈",1],
    ["c4","公交新村粉店","粉面","长沙米粉",28.18697,112.98754,4.7,1,"肉丝粉、码子粉","韶山北路附近",0],
    ["c5","盟重烧烤","烧烤","夜宵烧烤",28.20156,112.97062,4.6,2,"牛油、烤排骨","潮宗街附近",1],
    ["c6","茶颜悦色·国金街店","茶饮","新中式茶饮",28.19573,112.97625,4.5,1,"幽兰拿铁","长沙国金中心附近",1],
    ["c7","炊烟小炒黄牛肉","湘菜","湖南菜",28.19333,112.97965,4.6,3,"小炒黄牛肉","解放西路附近",1],
    ["c8","时光里咖啡馆","咖啡","独立咖啡",28.20468,112.97015,4.7,2,"桂花拿铁","潮宗街",1]
  ].map(x=>({id:x[0],name:x[1],category:x[2],cuisine:x[3],lat:x[4],lng:x[5],rating:x[6],price:x[7],signature:x[8],address:x[9],open:!!x[10],source:"精选"}));
  let places=[...curated],center=[...C],category="全部",selected=null,openOnly=false,full=false,tile,markers=L.layerGroup();
  let saved=read("foodmap-saved"),checked=read("foodmap-checked"),theme=localStorage.getItem("foodmap-theme")||"day";
  const $=id=>document.getElementById(id), app=$("app");
  function read(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return[]}}
  function dist(a,b){const r=6371,p=Math.PI/180,d1=(b[0]-a[0])*p,d2=(b[1]-a[1])*p,q=Math.sin(d1/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(d2/2)**2;return 2*r*Math.asin(Math.sqrt(q))}
  function dt(k){return k<1?Math.round(k*1000)+"m":k.toFixed(1)+"km"}
  function toast(s){const e=$("toast");e.textContent=s;e.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hidden"),2800)}
  function setTheme(){app.classList.toggle("night",theme==="night");$("theme").textContent=theme==="night"?"☀":"☾";if(map){if(tile)map.removeLayer(tile);tile=L.tileLayer(theme==="night"?"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png":"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap © CARTO"}).addTo(map)}}
  const map=L.map("map",{zoomControl:false,attributionControl:true,minZoom:3}).setView(C,15);markers.addTo(map);L.control.zoom({position:"bottomright"}).addTo(map);setTheme();
  map.on("moveend",()=>{const c=map.getCenter();center=[c.lat,c.lng];render()});
  function results(){
    const key=$("keyword").value.trim().toLowerCase(),radius=+$("radius").value,price=+$("price").value,sort=$("sort").value;
    const list=places.map(p=>({...p,distance:dist(center,[p.lat,p.lng])})).filter(p=>(category==="全部"||p.category===category)&&p.distance<=radius&&(!price||p.price===price)&&(!openOnly||p.open!==false)&&(!key||(p.name+p.category+p.cuisine+p.signature).toLowerCase().includes(key)));
    list.sort(sort==="距离"?(a,b)=>a.distance-b.distance:sort==="评分"?(a,b)=>(b.rating||0)-(a.rating||0):(a,b)=>(b.rating||4.1)-(a.rating||4.1)+(a.distance-b.distance)*.08);return list;
  }
  function render(){
    const list=results();$("count").textContent=`${list.length} 个结果 · 地图与列表联动`;
    markers.clearLayers();
    list.forEach((p,i)=>{const icon=L.divIcon({className:"pin-wrap",html:`<div class="pin ${p.source==="地图"?"live":""} ${selected&&selected.id===p.id?"active":""}"><span>${i+1}</span></div>`,iconSize:[40,48],iconAnchor:[20,46]});L.marker([p.lat,p.lng],{icon}).on("click",()=>focus(p)).addTo(markers)});
    $("cards").innerHTML=list.length?list.map((p,i)=>`<article class="card ${selected&&selected.id===p.id?"active":""}" data-id="${p.id}"><div class="pic" style="background:${["linear-gradient(145deg,#ba6038,#643622)","linear-gradient(145deg,#4f7352,#263f31)","linear-gradient(145deg,#8a5a3d,#4d3023)","linear-gradient(145deg,#95723d,#4c3821)"][i%4]}"><b>${p.name.slice(0,1)}</b><small>${p.category} · ${p.source}</small></div><div class="copy"><div class="title"><h3>${p.name}</h3><button class="save" data-save="${p.id}">${saved.includes(p.id)?"♥":"♡"}</button></div><div class="rating"><b>★ ${p.rating||"地图发现"}</b><span>人均 ${"¥".repeat(p.price)}</span></div><p>${p.address}</p><strong>推荐：${p.signature}</strong><div class="meta"><span>${dt(p.distance)}</span><i>${p.open===false?"休息中":"可到店"}</i></div></div></article>`).join(""):`<div class="empty"><h2>附近暂时没有结果</h2><p>放大距离或切换分类试试</p></div>`;
    $("cards").querySelectorAll(".card").forEach(e=>e.onclick=ev=>{if(ev.target.dataset.save)return;focus(places.find(p=>p.id===e.dataset.id))});
    $("cards").querySelectorAll("[data-save]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();toggleSave(e.dataset.save)});
    renderSaved();stats();
  }
  function focus(p){selected=p;map.flyTo([p.lat,p.lng],16,{duration:.55});const d=dist(center,[p.lat,p.lng]);$("detail").innerHTML=`<button class="x" id="detailClose">×</button><small>${p.category} · ${p.cuisine}</small><h2>${p.name}</h2><p>★ ${p.rating||"地图发现"} · ${dt(d)} · ${p.address}<br><b>推荐：${p.signature}</b></p><div class="actions"><button id="detailSave">${saved.includes(p.id)?"已收藏":"收藏"}</button><button id="navTo">导航</button><button class="primary" id="checkin">${checked.includes(p.id)?"已点亮":"到店打卡"}</button></div>`;$("detail").classList.remove("hidden");$("detailClose").onclick=()=>{$("detail").classList.add("hidden");selected=null;render()};$("detailSave").onclick=()=>toggleSave(p.id);$("navTo").onclick=()=>window.open(`https://uri.amap.com/navigation?to=${p.lng},${p.lat},${encodeURIComponent(p.name)}&mode=walk&src=xingji-food-map`,"_blank");$("checkin").onclick=()=>checkin(p);render()}
  function toggleSave(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem("foodmap-saved",JSON.stringify(saved));toast(saved.includes(id)?"已加入收藏":"已取消收藏");render();if(selected&&selected.id===id)focus(selected)}
  function checkin(p){const d=dist(center,[p.lat,p.lng]);if(d>.25)return toast(`距离约 ${dt(d)}，进入250米内才能打卡`);if(!checked.includes(p.id)){checked.push(p.id);localStorage.setItem("foodmap-checked",JSON.stringify(checked))}toast(`打卡成功，已点亮「${p.name}」`);focus(p)}
  function renderSaved(){const list=places.filter(p=>saved.includes(p.id));$("savedList").innerHTML=list.length?list.map(p=>`<article class="card" data-id="${p.id}"><div class="pic"><b>${p.name.slice(0,1)}</b><small>${p.category}</small></div><div class="copy"><div class="title"><h3>${p.name}</h3><button class="save" data-save="${p.id}">♥</button></div><div class="rating"><b>★ ${p.rating||"地图发现"}</b></div><p>${p.address}</p><strong>${p.signature}</strong></div></article>`).join(""):`<div class="empty"><span>♡</span><h2>还没有收藏</h2><p>在地图上找到喜欢的店，点一下爱心就能保存。</p></div>`;$("savedList").querySelectorAll("[data-save]").forEach(e=>e.onclick=()=>toggleSave(e.dataset.save))}
  function stats(){$("statSaved").textContent=saved.length;$("statChecked").textContent=checked.length}
  async function nearby(at=center){$("reload").textContent="…";toast("正在搜索附近真实餐饮地点");const q=`[out:json][timeout:15];(node["amenity"~"restaurant|cafe|fast_food"](around:3000,${at[0]},${at[1]});way["amenity"~"restaurant|cafe|fast_food"](around:3000,${at[0]},${at[1]}););out center tags 80;`;try{const r=await fetch("https://overpass-api.de/api/interpreter?data="+encodeURIComponent(q));if(!r.ok)throw 0;const data=await r.json(),live=[];data.elements.forEach(el=>{const t=el.tags||{},lat=el.lat||(el.center||{}).lat,lng=el.lon||(el.center||{}).lon;if(!lat||!lng||!t.name)return;const raw=(t.cuisine||"").toLowerCase(),cat=t.amenity==="cafe"||raw.includes("coffee")?"咖啡":raw.includes("noodle")?"粉面":t.amenity==="fast_food"?"小吃":"餐厅";live.push({id:`osm-${el.type}-${el.id}`,name:t["name:zh"]||t.name,category:cat,cuisine:t.cuisine||cat,lat,lng,rating:null,price:2,signature:cat==="咖啡"?"咖啡与甜点":"到店看看招牌菜",address:[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join("")||"地图附近地点",open:null,source:"地图"})});places=[...curated,...live];toast(`已发现 ${live.length} 个附近餐饮地点`);render()}catch{toast("实时数据加载较慢，先显示精选美食")}finally{$("reload").textContent="↻"}}
  function locate(){if(!navigator.geolocation)return toast("当前浏览器不支持定位");toast("正在获取你的位置…");navigator.geolocation.getCurrentPosition(p=>{center=[p.coords.latitude,p.coords.longitude];$("where").querySelector("span").textContent="我的当前位置";map.flyTo(center,16,{duration:.7});toast("定位成功，正在发现附近美食");nearby(center)},()=>toast("请允许位置权限，当前显示长沙示例"),{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}
  const cats=["全部","湘菜","小吃","粉面","烧烤","咖啡","茶饮","餐厅"];$("chips").innerHTML=cats.map(c=>`<button class="${c==="全部"?"on":""}" data-cat="${c}">${c}</button>`).join("");$("chips").onclick=e=>{if(!e.target.dataset.cat)return;category=e.target.dataset.cat;$("chips").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.cat===category));render()};
  ["radius","price","sort"].forEach(id=>$(id).onchange=render);$("keyword").oninput=render;$("openOnly").onclick=()=>{openOnly=!openOnly;$("openOnly").classList.toggle("on",openOnly);render()};$("locate").onclick=locate;$("where").onclick=locate;$("reload").onclick=()=>nearby(center);$("theme").onclick=()=>{theme=theme==="day"?"night":"day";localStorage.setItem("foodmap-theme",theme);setTheme()};
  $("handle").onclick=$("expand").onclick=()=>{full=!full;$("sheet").classList.toggle("full",full);$("expand").textContent=full?"收起":"查看全部"};
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{const t=b.dataset.tab;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.tab===t));$("mapPage").classList.toggle("hidden",t!=="map");$("savedPage").classList.toggle("hidden",t!=="saved");$("profilePage").classList.toggle("hidden",t!=="profile");if(t==="map")setTimeout(()=>map.invalidateSize(),20);if(t==="saved")renderSaved();if(t==="profile")stats()});
  $("aiOpen").onclick=()=>$("aiOverlay").classList.remove("hidden");$("aiClose").onclick=()=>$("aiOverlay").classList.add("hidden");$("prompts").onclick=e=>{if(e.target.tagName==="BUTTON")$("aiQuery").value=e.target.textContent};$("aiAsk").onclick=()=>{const q=$("aiQuery").value.trim();if(!q)return;const list=results(),p=list.find(x=>q.includes("咖啡")?x.category==="咖啡":q.includes("辣")?["湘菜","烧烤"].includes(x.category):true)||list[0];$("aiReply").textContent=p?`现在先推荐「${p.name}」：离地图中心约 ${dt(dist(center,[p.lat,p.lng]))}，招牌是${p.signature}。正式接入 GPT 后，会进一步结合预算、人数和排队情况。`:"附近暂时没有符合条件的地点，请放大距离再试。";$("aiReply").classList.remove("hidden")};
  render();
  setTimeout(()=>nearby(C),900);
})();
</script>
