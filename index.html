x;border:0;border-radius:12px;background:var(--red);color:white;font-weight:800}.login-box .cancel{width:100%;margin-top:8px;border:0;background:none;color:var(--muted);padding:8px}

<body>
<div id="app" class="app">
  <header>
    <button class="brand" data-tab="map"><b>行迹</b><span>美食地图</span></button>
    <button id="where" class="where"><i>⌖</i><span>长沙·五一广场</span></button>
    <div class="head-actions"><button id="aiOpen" class="ai-btn" aria-label="AI找吃的">✦</button><button id="theme" class="theme-btn" aria-label="切换日夜模式">☾</button></div>
  </header>
  <section id="mapPage">
    <div id="map"></div>
    <div class="searchbox">
      <div class="searchrow"><span>⌕</span><input id="keyword" placeholder="搜索餐厅、菜系或招牌菜"><em>AI 可接入</em></div>
      <div id="chips" class="chips"></div>
      <div class="filters">
        <select id="radius"><option value="1">1公里内</option><option value="3">3公里内</option><option value="5" selected>5公里内</option><option value="10">10公里内</option></select>
        <select id="price"><option value="0">不限人均</option><option value="1">¥ 经济</option><option value="2">¥¥ 适中</option><option value="3">¥¥¥ 品质</option></select>
        <select id="sort"><option>推荐</option><option>距离</option><option>评分</option></select>
        <button id="openOnly">营业中</button>
      </div>
    </div>
    <button id="locate" class="map-fab locate" aria-label="定位">⌖</button>
    <button id="reload" class="map-fab reload" aria-label="搜索此区域">↻</button>
    <div id="detail" class="detail hidden"></div>
    <section id="sheet" class="sheet">
      <button id="handle" class="handle" aria-label="展开附近美食"></button>
      <div class="sheet-head"><div><small>NEARBY FOOD</small><h2>附近值得吃</h2><p id="count">正在准备推荐…</p></div><button id="expand">查看全部</button></div>
      <div id="cards" class="cards"></div>
    </section>
  </section>
  <section id="savedPage" class="page hidden"><div class="page-title"><small>MY COLLECTION</small><h1>我的收藏</h1><p>把想吃的地方放进自己的美食清单</p></div><div id="savedList" class="saved-list"></div></section>
  <section id="badgesPage" class="page hidden"><div class="page-title"><small>COLLECTED MOMENTS</small><h1>我的徽章</h1><p>走到店铺附近完成打卡，点亮城市的每一口味道。</p></div><div id="badgeGrid" class="badge-grid"></div></section>
  <section id="profilePage" class="page hidden"><div id="profileContent"></div></section>
  <nav><button class="on" data-tab="map"><i>⌖</i>地图</button><button data-tab="badges"><i>✦</i>徽章</button><button data-tab="saved"><i>♡</i>收藏</button><button data-tab="profile"><i>◉</i>我的</button></nav>
  <div id="aiOverlay" class="overlay hidden"><div class="ai-sheet"><button id="aiClose" class="x">×</button><div class="ai-logo">✦</div><small>AI FOOD GUIDE</small><h2>附近吃什么？</h2><p>先用当前地点与筛选条件给你推荐。正式接入 GPT 后，可进一步理解预算、口味、人数和排队偏好。</p><div id="prompts" class="prompts"><button>附近100元以内两个人吃什么</button><button>想吃辣的，不想排队</button><button>找一家安静的咖啡店</button></div><div class="ask"><input id="aiQuery" placeholder="告诉我现在想吃什么"><button id="aiAsk">推荐</button></div><div id="aiReply" class="reply hidden"></div></div></div>
  <div id="badgeOverlay" class="badge-overlay hidden"><i class="badge-spark a">✦</i><i class="badge-spark b">✦</i><i class="badge-spark c">✧</i><div class="badge-card"><div class="badge-top"><small>CHECK-IN COMPLETE</small><div class="badge-medal">🍜</div></div><h2>获得「湘味寻踪」</h2><p id="badgeText">打卡成功，你的第一枚美食徽章已点亮。</p><button id="badgeClose">收下徽章</button></div></div>
  <div id="loginOverlay" class="overlay hidden"><div class="login-box"><h2>登录行迹</h2><p>登录后可把徽章、收藏与口味偏好同步到新手机。</p><input id="loginName" maxlength="18" placeholder="输入你的昵称"><button id="loginSubmit" class="primary">登录 / 注册</button><button id="loginCancel" class="cancel">暂不登录</button></div></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const C=[28.1953,112.9769];
  const curated=[
    ["c1","文和友老长沙龙虾馆","湘菜","长沙小吃",28.19093,112.97178,4.7,2,"口味虾、猪油拌粉","海信广场附近",1],
    ["c2","黑色经典臭豆腐","小吃","街头小吃",28.19441,112.97516,4.6,1,"黑色臭豆腐","黄兴南路步行街",1],
    ["c3","笨萝卜浏阳菜馆","湘菜","浏阳菜",28.19826,112.97874,4.8,2,"酸菜炒粉皮、金钱蛋","五一广场商圈",1],
    ["c4","公交新村粉店","粉面","长沙米粉",28.18697,112.98754,4.7,1,"肉丝粉、码子粉","韶山北路附近",0],
    ["c5","盟重烧烤","烧烤","夜宵烧烤",28.20156,112.97062,4.6,2,"牛油、烤排骨","潮宗街附近",1],
    ["c6","茶颜悦色·国金街店","茶饮","新中式茶饮",28.19573,112.97625,4.5,1,"幽兰拿铁","长沙国金中心附近",1],
    ["c7","炊烟小炒黄牛肉","湘菜","湖南菜",28.19333,112.97965,4.6,3,"小炒黄牛肉","解放西路附近",1],
    ["c8","时光里咖啡馆","咖啡","独立咖啡",28.20468,112.97015,4.7,2,"桂花拿铁","潮宗街",1]
  ].map((x,i)=>({id:x[0],name:x[1],category:x[2],cuisine:x[3],lat:x[4],lng:x[5],rating:x[6],price:x[7],signature:x[8],address:x[9],open:!!x[10],source:"精选",photo:["https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=500&q=80","https://images.unsplash.com/photo-1552611052-33e04de081de?auto=format&fit=crop&w=500&q=80","https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=500&q=80","https://images.unsplash.com/photo-1555126634-323283e090fa?auto=format&fit=crop&w=500&q=80","https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?auto=format&fit=crop&w=500&q=80","https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=500&q=80","https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=500&q=80","https://images.unsplash.com/photo-1511081692775-05d0f180a065?auto=format&fit=crop&w=500&q=80"][i]}));
  let places=[...curated],center=[...C],userPosition=null,userMarker=null,accuracyCircle=null,watchId=null,lastNearbyPosition=null,category="全部",selected=null,openOnly=false,full=false,tile,markers=L.layerGroup();
  let saved=read("foodmap-saved"),checked=read("foodmap-checked"),theme=localStorage.getItem("foodmap-theme")||"day",account=JSON.parse(localStorage.getItem("xingji-account")||"null");
  const $=id=>document.getElementById(id), app=$("app");
  function read(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return[]}}
  function dist(a,b){const r=6371,p=Math.PI/180,d1=(b[0]-a[0])*p,d2=(b[1]-a[1])*p,q=Math.sin(d1/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(d2/2)**2;return 2*r*Math.asin(Math.sqrt(q))}
  function dt(k){return k<1?Math.round(k*1000)+"m":k.toFixed(1)+"km"}
  function toast(s){const e=$("toast");e.textContent=s;e.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hidden"),2800)}
  function setTheme(){app.classList.toggle("night",theme==="night");$("theme").textContent=theme==="night"?"☀":"☾";if(map){if(tile)map.removeLayer(tile);tile=L.tileLayer(theme==="night"?"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png":"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap © CARTO"}).addTo(map)}}
  const map=L.map("map",{zoomControl:false,attributionControl:true,minZoom:3}).setView(C,15);markers.addTo(map);L.control.zoom({position:"bottomright"}).addTo(map);setTheme();
  // 拖动地图只更新当前搜索中心；不重绘标记，避免拖动和点店铺时出现闪烁、抖动。
  map.on("moveend",()=>{const c=map.getCenter();center=[c.lat,c.lng]});
  function anchor(){return userPosition||center}
  function updateUserMarker(coords,accuracy){
    userPosition=coords;
    const icon=L.divIcon({className:"user-dot-wrap",html:'<div class="user-dot" aria-label="我的当前位置"></div>',iconSize:[30,30],iconAnchor:[15,15]});
    if(!userMarker) userMarker=L.marker(coords,{icon,interactive:false,zIndexOffset:1000}).addTo(map); else userMarker.setLatLng(coords);
    if(!accuracyCircle) accuracyCircle=L.circle(coords,{radius:Math.max(accuracy||0,20),color:"#2d8cff",weight:1,fillColor:"#2d8cff",fillOpacity:.10,interactive:false}).addTo(map); else accuracyCircle.setLatLng(coords).setRadius(Math.max(accuracy||0,20));
  }
  function results(){
    const key=$("keyword").value.trim().toLowerCase(),radius=+$("radius").value,price=+$("price").value,sort=$("sort").value;
    const from=anchor();
    const list=places.map(p=>({...p,distance:dist(from,[p.lat,p.lng])})).filter(p=>(category==="全部"||p.category===category)&&p.distance<=radius&&(!price||p.price===price)&&(!openOnly||p.open!==false)&&(!key||(p.name+p.category+p.cuisine+p.signature).toLowerCase().includes(key)));
    list.sort(sort==="距离"?(a,b)=>a.distance-b.distance:sort==="评分"?(a,b)=>(b.rating||0)-(a.rating||0):(a,b)=>(b.rating||4.1)-(a.rating||4.1)+(a.distance-b.distance)*.08);return list;
  }
  function render(){
    const list=results();$("count").textContent=`${list.length} 个结果 · 地图与列表联动`;
    markers.clearLayers();
    list.forEach(p=>{const icon=L.divIcon({className:"pin-wrap",html:foodPin(p),iconSize:[92,43],iconAnchor:[22,42]});L.marker([p.lat,p.lng],{icon,keyboard:true,title:p.name,riseOnHover:true}).on("click",()=>focus(p)).addTo(markers)});
    $("cards").innerHTML=list.length?list.map((p,i)=>`<article class="card ${selected&&selected.id===p.id?"active":""}" data-id="${p.id}"><div class="pic"><img class="place-photo" src="${p.photo||"https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=500&q=80"}" alt="${p.name} 店铺图片"><small>${p.category} · ${p.source}</small></div><div class="copy"><div class="title"><h3>${p.name}</h3><button class="save" data-save="${p.id}">${saved.includes(p.id)?"♥":"♡"}</button></div><div class="rating"><b>★ ${p.rating||"地图发现"}</b><span>人均 ${"¥".repeat(p.price)}</span></div><p>${p.address}</p><strong>推荐：${p.signature}</strong><div class="meta"><span>${dt(p.distance)}</span><i class="${p.distance<=.25?"ready":"too-far"}">${p.open===false?"休息中":p.distance<=.25?"现在可打卡":"距你较远"}</i></div></div></article>`).join(""):`<div class="empty"><h2>附近暂时没有结果</h2><p>放大距离或切换分类试试</p></div>`;
    $("cards").querySelectorAll(".card").forEach(e=>e.onclick=ev=>{if(ev.target.dataset.save)return;focus(places.find(p=>p.id===e.dataset.id))});
    $("cards").querySelectorAll("[data-save]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();toggleSave(e.dataset.save)});
    renderSaved();renderBadges();renderProfile();
  }
  function foodPin(p){const icons={"湘菜":"🌶️","小吃":"🍢","粉面":"🍜","烧烤":"🍖","咖啡":"☕","茶饮":"🧋","餐厅":"🍽️"};const icon=icons[p.category]||"🍽️",price="¥".repeat(Math.max(1,p.price||1));return `<div class="food-pin ${p.source==="地图"?"live":""} ${selected&&selected.id===p.id?"active":""}"><span class="food-icon">${icon}</span><span class="food-price">${price}</span></div>`}
  function focus(p){selected=p;const d=dist(anchor(),[p.lat,p.lng]),canCheck=!!userPosition&&d<=.25;$("detail").innerHTML=`<button class="x" id="detailClose">×</button><small>${p.category} · ${p.cuisine}</small><h2>${p.name}</h2><p>★ ${p.rating||"地图发现"} · ${dt(d)} · ${p.address}<br><b>推荐：${p.signature}</b><br>${userPosition?(canCheck?"<b style=\"color:#16845c\">你已到店附近，现在可以打卡</b>":"需进入店铺 250 米内才能打卡"):"请先点左下角定位，验证到店距离"}</p><div class="actions"><button id="detailSave">${saved.includes(p.id)?"已收藏":"收藏"}</button><button id="navTo">导航</button><button class="primary" id="checkin">${checked.includes(p.id)?"已点亮":canCheck?"到店打卡":"未到店"}</button></div>`;$("detail").classList.remove("hidden");$("detailClose").onclick=()=>{$("detail").classList.add("hidden");selected=null;render()};$("detailSave").onclick=()=>toggleSave(p.id);$("navTo").onclick=()=>window.open(`https://uri.amap.com/navigation?to=${p.lng},${p.lat},${encodeURIComponent(p.name)}&mode=walk&src=xingji-food-map`,"_blank");$("checkin").onclick=()=>checkin(p);render()}
  function toggleSave(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem("foodmap-saved",JSON.stringify(saved));toast(saved.includes(id)?"已加入收藏":"已取消收藏");render();if(selected&&selected.id===id)focus(selected)}
  function checkin(p){if(!userPosition)return toast("请先点左下角定位，获得位置后才能到店打卡");const d=dist(userPosition,[p.lat,p.lng]);if(d>.25)return toast(`你距离这家店约 ${dt(d)}，进入250米内才能打卡`);const fresh=!checked.includes(p.id);if(fresh){checked.push(p.id);localStorage.setItem("foodmap-checked",JSON.stringify(checked));$("badgeText").textContent=`${p.name} · ${p.signature}。你已在店铺附近完成打卡，这枚美食徽章已收入你的行迹。`;$("badgeOverlay").classList.remove("hidden")}else toast("这枚徽章已经点亮，去探索下一家吧");focus(p)}
  function renderSaved(){const list=places.filter(p=>saved.includes(p.id));$("savedList").innerHTML=list.length?list.map(p=>`<article class="card" data-id="${p.id}"><div class="pic"><img class="place-photo" src="${p.photo||"https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=500&q=80"}" alt="${p.name} 店铺图片"><small>${p.category}</small></div><div class="copy"><div class="title"><h3>${p.name}</h3><button class="save" data-save="${p.id}">♥</button></div><div class="rating"><b>★ ${p.rating||"地图发现"}</b></div><p>${p.address}</p><strong>${p.signature}</strong></div></article>`).join(""):`<div class="empty"><span>♡</span><h2>还没有收藏</h2><p>在地图上找到喜欢的店，点一下爱心就能保存。</p></div>`;$("savedList").querySelectorAll("[data-save]").forEach(e=>e.onclick=()=>toggleSave(e.dataset.save))}
  function renderBadges(){const list=places.filter(p=>checked.includes(p.id));$("badgeGrid").innerHTML=list.length?list.map(p=>`<article class="badge-item"><span class="badge-state">已点亮</span><div class="badge-icon">${({"湘菜":"🌶️","小吃":"🍢","粉面":"🍜","烧烤":"🍖","咖啡":"☕","茶饮":"🧋"}[p.category]||"🍽️")}</div><h3>「${p.category}寻踪」</h3><p>${p.name}<br>${p.signature}</p></article>`).join("")+`<article class="badge-item locked"><div class="badge-icon">✦</div><h3>下一枚徽章</h3><p>在地图上选择一家店<br>走进 250 米内即可打卡。</p></article>`:`<div class="empty" style="grid-column:1/-1"><span>✦</span><h2>还没有点亮徽章</h2><p>打开地图，允许定位，到店铺附近完成第一次打卡。</p></div>`}
  function renderProfile(){const host=$("profileContent");host.innerHTML=account?`<div class="profile-card"><div class="account-line"><div class="avatar">${account.name.slice(0,1)}</div><div><h1>${account.name}</h1><p>第 ${Math.max(1,Math.ceil(checked.length/3)+1)} 级 · 城市味觉探索者</p></div></div><div class="stats"><span><b>${saved.length}</b>收藏</span><span><b>${checked.length}</b>已打卡</span><span><b>1</b>探索城市</span></div></div><div class="future"><small>AI FOOD GUIDE · READY</small><h2>你的口味地图</h2><p>接入后端后，AI 会根据实时位置、收藏与打卡记录，为你推荐附近下一家。</p></div><p class="login-note">账户同步接口已预留，当前为本机演示登录。</p>`:`<div class="profile-card login-card"><div class="avatar">迹</div><h1>登录，保存你的行迹</h1><p>同步收藏、打卡徽章与口味偏好；换新手机也不会丢失。</p><button id="openLogin">登录 / 注册</button></div><div class="future"><small>GUEST MODE</small><h2>先随便逛逛</h2><p>不登录也能使用地图和实时定位；登录后才会开启跨设备同步。</p></div>`;const b=$("openLogin");if(b)b.onclick=()=>$('loginOverlay').classList.remove('hidden')}
  async function nearby(at=center){$("reload").textContent="…";toast("正在按你的当前位置更新附近店铺");const q=`[out:json][timeout:15];(node["amenity"~"restaurant|cafe|fast_food"](around:3000,${at[0]},${at[1]});way["amenity"~"restaurant|cafe|fast_food"](around:3000,${at[0]},${at[1]}););out center tags 80;`;try{const r=await fetch("https://overpass-api.de/api/interpreter?data="+encodeURIComponent(q));if(!r.ok)throw 0;const data=await r.json(),live=[];data.elements.forEach(el=>{const t=el.tags||{},lat=el.lat||(el.center||{}).lat,lng=el.lon||(el.center||{}).lon;if(!lat||!lng||!t.name)return;const raw=(t.cuisine||"").toLowerCase(),cat=t.amenity==="cafe"||raw.includes("coffee")?"咖啡":raw.includes("noodle")?"粉面":t.amenity==="fast_food"?"小吃":"餐厅";live.push({id:`osm-${el.type}-${el.id}`,name:t["name:zh"]||t.name,category:cat,cuisine:t.cuisine||cat,lat,lng,rating:null,price:2,signature:cat==="咖啡"?"咖啡与甜点":"到店看看招牌菜",address:[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join("")||"地图附近地点",open:null,source:"地图",photo:(t.image||t["image:0"]||"")})});places=[...curated,...live];toast(`已按当前位置发现 ${live.length} 个附近店铺`);render()}catch{toast("实时地点数据加载较慢，先显示精选美食")}finally{$("reload").textContent="↻"}}
  function receiveLocation(p,move=true){const coords=[p.coords.latitude,p.coords.longitude];updateUserMarker(coords,p.coords.accuracy);$("where").querySelector("span").textContent="我的当前位置";if(move)map.flyTo(coords,16,{duration:.7});render();if(!lastNearbyPosition||dist(lastNearbyPosition,coords)>.3){lastNearbyPosition=coords;nearby(coords)}}
  function locate(){if(!navigator.geolocation)return toast("当前浏览器不支持定位");toast("正在获取你的位置…");navigator.geolocation.getCurrentPosition(p=>{receiveLocation(p);toast("定位成功，已更新附近可打卡店铺");if(watchId===null)watchId=navigator.geolocation.watchPosition(p=>receiveLocation(p,false),()=>{}, {enableHighAccuracy:true,maximumAge:10000})},()=>toast("请在浏览器里允许位置权限，才能显示你的图标和可打卡店铺"),{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}
  const cats=["全部","湘菜","小吃","粉面","烧烤","咖啡","茶饮","餐厅"];$("chips").innerHTML=cats.map(c=>`<button class="${c==="全部"?"on":""}" data-cat="${c}">${c}</button>`).join("");$("chips").onclick=e=>{if(!e.target.dataset.cat)return;category=e.target.dataset.cat;$("chips").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.cat===category));render()};
  ["radius","price","sort"].forEach(id=>$(id).onchange=render);$("keyword").oninput=render;$("openOnly").onclick=()=>{openOnly=!openOnly;$("openOnly").classList.toggle("on",openOnly);render()};$("locate").onclick=locate;$("where").onclick=locate;$("reload").onclick=()=>nearby(center);$("theme").onclick=()=>{theme=theme==="day"?"night":"day";localStorage.setItem("foodmap-theme",theme);setTheme()};
  $("handle").onclick=$("expand").onclick=()=>{full=!full;$("sheet").classList.toggle("full",full);$("expand").textContent=full?"收起":"查看全部"};
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{const t=b.dataset.tab;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.tab===t));$("mapPage").classList.toggle("hidden",t!=="map");$("savedPage").classList.toggle("hidden",t!=="saved");$("badgesPage").classList.toggle("hidden",t!=="badges");$("profilePage").classList.toggle("hidden",t!=="profile");if(t==="map")setTimeout(()=>map.invalidateSize(),20);if(t==="saved")renderSaved();if(t==="badges")renderBadges();if(t==="profile")renderProfile()});
  $("aiOpen").onclick=()=>$("aiOverlay").classList.remove("hidden");$("aiClose").onclick=()=>$("aiOverlay").classList.add("hidden");$("prompts").onclick=e=>{if(e.target.tagName==="BUTTON")$("aiQuery").value=e.target.textContent};$("aiAsk").onclick=()=>{const q=$("aiQuery").value.trim();if(!q)return;const list=results(),p=list.find(x=>q.includes("咖啡")?x.category==="咖啡":q.includes("辣")?["湘菜","烧烤"].includes(x.category):true)||list[0];$("aiReply").textContent=p?`现在先推荐「${p.name}」：离地图中心约 ${dt(dist(center,[p.lat,p.lng]))}，招牌是${p.signature}。正式接入 GPT 后，会进一步结合预算、人数和排队情况。`:"附近暂时没有符合条件的地点，请放大距离再试。";$("aiReply").classList.remove("hidden")};
  $("badgeClose").onclick=()=>$("badgeOverlay").classList.add("hidden");
  $("loginCancel").onclick=()=>$("loginOverlay").classList.add("hidden");$("loginSubmit").onclick=()=>{const name=$("loginName").value.trim();if(!name)return toast("先输入一个昵称");account={name};localStorage.setItem("xingji-account",JSON.stringify(account));$("loginOverlay").classList.add("hidden");renderProfile();toast("登录成功，后端接入后可同步到其他设备")};
  render();renderBadges();renderProfile();
  // 首次进入就发起授权；同意后持续监听位置，并在移动超过约 300 米时重新推荐。
  setTimeout(locate,700);
})();
</script>
